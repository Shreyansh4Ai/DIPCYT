model:
  img_size: 640
  num_queries: 32
  num_points: 6
  fpn_out_channels: 256
  pretrained_backbone: true
  pretrained_cache_path: yolov5s.pt
  head_encoder_layers:
  - 1
  - 2
  - 2
  - 2
  head_decoder_layers: 6
  head_nhead: 8
  head_dim_feedforward: 1024
  head_dropout: 0.1
  conf_bias_init: -4.0
  fpcbam_reduction_ratio: 32
  swin_window_size: 5
  swin_nhead: 8
  enable_gradient_checkpointing: false
loss:
  lambda_coord: 5.0
  lambda_giou: 0.6414313355903041
  lambda_conf: 2.0
  lambda_shape: 1.9455901926649632
  focal_alpha: 0.26652243238366186
  focal_gamma: 0.7697285674832611
matcher:
  center_cost_weight: 3.82920382968694
  size_cost_weight: 2.6411393175905733
  giou_cost_weight: 4.584049132667419
  bucket_thresholds:
  - 0.08
  - 0.16
  - 0.3
hardware:
  auto_probe_vram: false
  vram_safety_margin: 0.2
  target_effective_batch_size: 6
  micro_batch_size: 6
  gradient_accumulation_steps: 1
  max_oom_retries: 3
  use_amp: true
  amp_dtype: float16
  num_workers: 0
  persistent_workers: false
  pin_memory: false
  log_file: production_training.log
  log_every_n_steps: 20
  keep_last_k_checkpoints: 3
train:
  seed: 42
  num_epochs: 30
  optimizer: AdamW
  lr: 2.284455685002053e-05
  weight_decay: 0.0007128188058401369
  sgd_momentum: 0.9
  scheduler: cosine
  warmup_steps: 160
  grad_clip: 1.0
  backbone_unfreeze_epoch: 2
  checkpoint_dir: checkpoints
  save_every_epoch: 1
  proxy_num_images: 10
  proxy_num_iters: 800
  proxy_log_every: 100
data:
  img_dir: train2014
  ann_file: cocotext.v2.json
  max_targets: 128
  img_size: 640
  min_poly_area: 1.0e-06
  min_box_pixels: 26
  augment: true
  scale_range_lo: 0.7
  scale_range_hi: 1.3
  rotate_max_angle: 10
  flip_prob: 0.5
  jitter_prob: 0.5
  blur_prob: 0.2
  rotate_prob: 0.4
